[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sinas"
version = "0.3.0"
description = "Python SDK for SINAS - AI Agent Platform"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "SINAS Team" },
]
keywords = [
    "sinas",
    "ai",
    "agent",
    "llm",
    "chatbot",
    "mcp",
    "fastapi",
    "sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Framework :: FastAPI",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100.0",
    "email-validator>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/sinas/sinas-sdk"
Documentation = "https://docs.sinas.ai"
Repository = "https://github.com/sinas/sinas-sdk"

[tool.hatch.build.targets.wheel]
packages = ["sinas"]

[tool.hatch.build.targets.sdist]
exclude = [
  "test_env/",
  "*.pyc",
  "__pycache__/",
]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
